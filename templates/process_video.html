<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Video</title>
</head>
<body>
    <h1>Upload Video</h1>
    <form method="POST" enctype="multipart/form-data" action="/process_video">
        <input type="file" name="file" accept=".mp4, .avi, .mov, .mkv">
        <input type="submit" value="Upload and Process">
    </form>
</body>
</html>
